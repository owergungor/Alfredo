name: Release Alfredo APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Verify Production Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALFREDO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/alfredo-release.jks"

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore/alfredo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ALFREDO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALFREDO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALFREDO_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Signature & Fingerprint
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          EXPECTED_FP="5eebd507a890e4f855b1f9831014d1edd6e94312f53225b7d8381fed32de40c5"
          
          echo "=== 1. Calculating APK SHA-256 ==="
          sha256sum "$APK_PATH" | tee alfredo-release-sha256.txt
          SHA_VAL=$(awk '{print $1}' alfredo-release-sha256.txt)
          echo "APK_SHA256=$SHA_VAL" >> $GITHUB_ENV

          echo "=== 2. Verifying Production Signature ==="
          SIG_OUTPUT=$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK_PATH")
          echo "$SIG_OUTPUT"
          
          # Assert signature validity
          if ! echo "$SIG_OUTPUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"; then
            echo "ERROR: APK is not signed with v2 signature scheme!"
            exit 1
          fi

          # Assert exact certificate fingerprint match
          ACTUAL_FP=$(echo "$SIG_OUTPUT" | grep -i "Signer #1 certificate SHA-256 digest:" | head -n1 | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Expected Fingerprint: $EXPECTED_FP"
          echo "Actual Fingerprint:   $ACTUAL_FP"
          
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "ERROR: Release certificate fingerprint does not match official Alfredo key!"
            exit 1
          fi
          echo "SUCCESS: Certificate fingerprint matches official Alfredo key."

      - name: Secure Cleanup of Keystore
        if: always()
        run: |
          echo "Securely removing temporary production keystore..."
          rm -rf "$RUNNER_TEMP/keystore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            alfredo-release-sha256.txt
          name: "Alfredo ${{ github.ref_name }}"
          body: |
            ## Alfredo ${{ github.ref_name }} Release
            
            ### SHA-256 Checksum
            ```
            ${{ env.APK_SHA256 }}
            ```
            
            Official release signed with official production key (`CN=Alfredo Launcher, OU=Release, O=Alfredo, C=TR`).
          draft: false
          prerelease: false
